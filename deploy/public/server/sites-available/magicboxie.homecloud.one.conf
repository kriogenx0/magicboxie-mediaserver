# Public address for the media server on the home Raspberry Pi. deploy.sh
# renders __PI_UPSTREAM__ (the Pi's address across the VPS<->Pi tunnel) and
# installs this on the shared nginx host.
#
# There's no auth here on purpose: the Pi's nginx tags everything that
# arrives with an X-Forwarded-For as "public", and the app then requires the
# MagicBoxie password for it (and refuses home-only tokens). At home, on
# magicboxie.lan, no password is needed. Keeping the check in the app means
# Jellyfin clients (Swiftfin, the Apple TV app) log in normally instead of
# hitting a browser-only basic-auth prompt they can't answer.

# Slow down password guessing against the one shared password.
limit_req_zone $binary_remote_addr zone=magicboxie_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name magicboxie.homecloud.one;

    include snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name magicboxie.homecloud.one;

    ssl_certificate /etc/letsencrypt/live/magicboxie.homecloud.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magicboxie.homecloud.one/privkey.pem;
    include snippets/ssl-params.conf;

    client_max_body_size 0;
    proxy_read_timeout 300s;

    # Shared by both locations. X-Forwarded-For must always be set: it's
    # what makes the Pi treat these requests as public.
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-MagicBoxie-Network public;

    location ~ ^/(Users/AuthenticateByName|api/auth/) {
        limit_req zone=magicboxie_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://__PI_UPSTREAM__;
    }

    location / {
        proxy_pass http://__PI_UPSTREAM__;
    }
}
