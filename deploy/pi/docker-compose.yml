name: magicboxie-pi
services:
  magicboxie:
    build:
      context: ../..
    image: magicboxie-pi:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # nginx/magicboxie.conf tags every request lan or public; home needs no
      # password, magicboxie.homecloud.one does.
      MAGICBOXIE_TRUST_NETWORK_HEADER: "1"
    volumes:
      - /etc/magicboxie/docker.yaml:/etc/magicboxie/config.yaml:ro
      - /var/lib/magicboxie-docker:/var/lib/magicboxie
      # Preserve absolute artwork paths stored by the old magicbox server.
      - /var/lib/magicboxie-docker:/var/lib/magicbox
      - /content:/content
    restart: unless-stopped
