# MagicBoxie's LAN-facing HTTP endpoint. The application remains bound to
# loopback on port 8080; nginx is the only process exposed to the network.
# It's the default server, so requests by IP or any other name reach the app
# too, instead of nginx's "Welcome to nginx" page.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name magicboxie.lan magicboxie.local _;

    client_max_body_size 0;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
