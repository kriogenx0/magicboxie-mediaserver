# MagicBoxie's LAN-facing HTTP endpoint. The application remains bound to
# loopback on port 8080; nginx is the only process exposed to the network.
# It's the default server, so requests by IP or any other name reach the app
# too, instead of nginx's "Welcome to nginx" page.
#
# It also tells the app which network each request came from, in
# X-MagicBoxie-Network (the app trusts it because docker-compose.yml sets
# MAGICBOXIE_TRUST_NETWORK_HEADER). "lan" needs no password; "public" does.
# A request is "lan" only when it comes straight from a private address with
# no X-Forwarded-For: the VPS proxy for magicboxie.homecloud.one always adds
# one, so traffic it forwards over the tunnel is "public" even though the
# tunnel address is private. Sending the header yourself only makes a request
# "public", never "lan". The DropSync tunnel's subnet is always "public" too
# (the most specific range wins), so something on the VPS can't skip the
# password by connecting to the Pi directly without X-Forwarded-For.
geo $magicboxie_source {
    default        public;
    127.0.0.0/8    lan;
    10.9.1.0/24    public;
    10.0.0.0/8     lan;
    172.16.0.0/12  lan;
    192.168.0.0/16 lan;
    169.254.0.0/16 lan;
    ::1/128        lan;
    fc00::/7       lan;
    fe80::/10      lan;
}

map "$magicboxie_source:$http_x_forwarded_for" $magicboxie_network {
    default "public";
    "lan:"  "lan";
}

# Keep https when the VPS terminated TLS, so the app reports the right address.
map $http_x_forwarded_proto $magicboxie_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name magicboxie.lan magicboxie.local _;

    client_max_body_size 0;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $magicboxie_forwarded_proto;
        proxy_set_header X-MagicBoxie-Network $magicboxie_network;
    }
}
