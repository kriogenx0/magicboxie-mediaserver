listen_addr: ":8080"
movies_dir: "/content/movies"
music_dir: "/content/music"
data_dir: "/var/lib/magicboxie"

auth:
  # Generate with: magicboxie hash-password '<your password>'
  password_hash: ""

tmdb:
  # TMDB v4 read access token (https://www.themoviedb.org/settings/api)
  api_read_token: ""

transcode:
  max_concurrent_jobs: 1
  preset: "medium"
  crf: 20
  # CPU cores ffmpeg may use. Fewer runs slower but keeps the Pi cooler; 0 = all.
  threads: 2
  # Transcoding also pauses while anything is playing back, and while the CPU
  # is at or above this temperature (resumes 5 degrees cooler). 0 disables.
  pause_above_celsius: 65
